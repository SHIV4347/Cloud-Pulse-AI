{% load static %}
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Forgot Password - CloudPulse AI
  </title>

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet"
    href="{% static 'advisor/css/styles.css' %}?v=otp-reset-final">

</head>

<body>

  <canvas id="neural-bg"
    class="neural-bg"
    aria-hidden="true"></canvas>

  <main class="auth-page">

    <section class="auth-card">

      <a href="{% url 'advisor:index' %}"
        class="auth-logo">

        <span class="brand-icon">

          <i class="fa-solid fa-bolt"></i>

        </span>

        <span>CloudPulse AI</span>

      </a>

      <p class="auth-title">

        Secure password reset verification

      </p>

      {% if success %}
      <div class="success-message">
        {{ success }}
      </div>
      {% endif %}

      {% if error %}
      <div class="field-error"
        style="margin-bottom:16px;">
        {{ error }}
      </div>
      {% endif %}

      {% if not otp_sent %}

      <!-- STEP 1 -->

      <form method="post">

        {% csrf_token %}

        <input type="hidden"
          name="step"
          value="send_otp">

        <div class="input-group">

          <i class="fa-solid fa-envelope"></i>

          <input id="email"
            name="email"
            type="email"
            placeholder="Email"
            required>

          <label for="email">
            Email
          </label>

        </div>

        <button class="cta-button auth-submit-button"
          type="submit">

          <i class="fa-solid fa-paper-plane"></i>

          Send Verification Code

        </button>

      </form>

      {% else %}

      <!-- STEP 2 -->

      <form method="post">

        {% csrf_token %}

        <input type="hidden"
          name="step"
          value="verify_otp">

        <input type="hidden"
          name="email"
          value="{{ email }}">

        <div class="input-group">

          <i class="fa-solid fa-shield-halved"></i>

          <input id="otp"
            name="otp"
            maxlength="6"
            placeholder="6-digit OTP"
            required>

          <label for="otp">
            Verification Code
          </label>

        </div>

        <div class="input-group">

          <i class="fa-solid fa-lock"></i>

          <input id="password"
            name="password"
            type="password"
            placeholder="New password"
            required>

          <label for="password">
            New password
          </label>

        </div>

        <div class="input-group">

          <i class="fa-solid fa-lock"></i>

          <input id="password2"
            name="password2"
            type="password"
            placeholder="Confirm password"
            required>

          <label for="password2">
            Confirm password
          </label>

        </div>

        <button class="cta-button auth-submit-button"
          type="submit">

          <i class="fa-solid fa-key"></i>

          Update Password

        </button>

      </form>

      {% endif %}

      <a href="{% url 'advisor:login' %}"
        class="toggle-link">

        Back to login

      </a>

    </section>

  </main>

  <script src="{% static 'advisor/js/neural-bg.js' %}?v=otp-reset-final"></script>

</body>
</html>
